<svg viewBox="0 0 520 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of neural signal activity">
  <defs>
    <linearGradient id="vcosLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C17A45"></stop>
      <stop offset="100%" stop-color="#FF6B45"></stop>
    </linearGradient>
  </defs>
  <g stroke="url(#vcosLine)" stroke-width="2" fill="none" opacity=".55">
    <path d="M20 130 L90 70 L160 110 L230 50 L300 95 L370 40 L440 85 L500 55"></path>
  </g>
  <g fill="#102044">
    <circle cx="20" cy="130" r="5"></circle><circle cx="90" cy="70" r="5"></circle><circle cx="160" cy="110" r="5"></circle>
    <circle cx="230" cy="50" r="6" fill="#FF6B45"></circle><circle cx="300" cy="95" r="5"></circle><circle cx="370" cy="40" r="5"></circle>
    <circle cx="440" cy="85" r="5"></circle><circle cx="500" cy="55" r="5"></circle>
  </g>
  <g class="vcos-pulse-dots" fill="#FF6B45">
    <circle cx="230" cy="50" r="12" opacity=".25"><animate attributeName="r" values="8;18;8" dur="2.4s" repeatCount="indefinite"></animate><animate attributeName="opacity" values=".35;0;.35" dur="2.4s" repeatCount="indefinite"></animate></circle>
  </g>
</svg>